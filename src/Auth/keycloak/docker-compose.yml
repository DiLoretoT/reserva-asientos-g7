# Keycloak: servidor de autorización del sistema
# Uso: copiar .env.example a .env y ejecutar `docker compose up -d` en esta carpeta.
# Panel: http://localhost:8080  ·  Realm: reserva-asientos
#
# La base de Keycloak vive dentro del contenedor, sin volumen. Cada vez que el
# contenedor se crea de nuevo (`docker compose down` y después `up`), importa el
# realm desde ./realm. Así el JSON es la única fuente de verdad, y un cambio en él
# le llega a todos. Los cambios hechos a mano en el panel se pierden con `down`:
# si hay que conservarlos, se exporta el realm.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    container_name: keycloak
    # start-dev: modo desarrollo, sin HTTPS.
    # --import-realm: carga al arrancar los realms exportados en ./realm.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # El realm exportado los lee como ${...} al importarse: así no quedan en el repo.
      AVAILABILITY_WEB_CLIENT_SECRET: ${AVAILABILITY_WEB_CLIENT_SECRET}
      BOOKING_API_CLIENT_SECRET: ${BOOKING_API_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    ports:
      # Solo acepta conexiones desde esta PC: así nadie de la misma red llega al panel.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import
